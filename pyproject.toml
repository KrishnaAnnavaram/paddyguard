[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddyguard"
version = "0.1.0"
description = "Weather-aware paddy (rice) leaf disease detection"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
paddyguard = "paddyguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
